name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build every target
        run: make build-all
      - name: Checksums
        working-directory: bin
        run: sha256sum sbmgr-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*|v0.*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" bin/sbmgr-* bin/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes $flags
